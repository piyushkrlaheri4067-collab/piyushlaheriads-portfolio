<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIYUSHLAHERIADS | Digital Creator</title>
    <meta
      name="description"
      content="PIYUSHLAHERIADS — Digital Creator portfolio featuring sub-brands and creator links."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #07111f;
        --bg-2: #0f1b2d;
        --panel: rgba(12, 21, 35, 0.82);
        --card: rgba(18, 30, 47, 0.78);
        --card-border: rgba(255, 255, 255, 0.08);
        --text: #edf4ff;
        --muted: #a2b4d4;
        --soft: #dfeaff;
        --accent: #7dd3fc;
        --accent-2: #a78bfa;
        --accent-3: #5eead4;
        --shadow: rgba(4, 9, 16, 0.55);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(167, 139, 250, 0.22), transparent 35%),
          radial-gradient(circle at top right, rgba(94, 234, 212, 0.18), transparent 30%),
          linear-gradient(135deg, var(--bg), var(--bg-2) 40%, #0a1220 100%);
        color: var(--text);
        min-height: 100vh;
      }

      a {
        text-decoration: none;
      }

      .container {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 36px 0 80px;
      }

      .topbar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 26px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid var(--card-border);
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        box-shadow: 0 0 18px rgba(0, 0, 0, 0.2);
        color: var(--soft);
        font-size: 0.82rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .hero {
        position: relative;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(11, 18, 31, 0.9), rgba(13, 24, 39, 0.95));
        border: 1px solid var(--card-border);
        border-radius: 28px;
        padding: 48px 34px 34px;
        box-shadow: 0 20px 60px var(--shadow);
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: -40% auto auto -15%;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(125, 211, 252, 0.35), transparent 60%);
        filter: blur(12px);
      }

      .hero::after {
        content: "";
        position: absolute;
        right: -80px;
        bottom: -120px;
        width: 360px;
        height: 360px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(167, 139, 250, 0.3), transparent 60%);
        filter: blur(16px);
      }

      .hero-inner {
        position: relative;
        z-index: 1;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 18px;
        padding: 8px 14px;
        background: rgba(125, 211, 252, 0.08);
        border: 1px solid rgba(125, 211, 252, 0.28);
        border-radius: 999px;
        color: var(--accent);
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 700;
      }

      h1 {
        font-size: clamp(2.7rem, 6vw, 5rem);
        line-height: 0.96;
        letter-spacing: -0.06em;
        margin-bottom: 14px;
      }

      .subtitle {
        font-size: clamp(1.15rem, 2vw, 1.7rem);
        color: var(--muted);
        margin-bottom: 18px;
      }

      .founder {
        color: var(--soft);
        font-size: 0.98rem;
        letter-spacing: 0.04em;
        margin-bottom: 28px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
      }

      .primary-btn,
      .ghost-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 20px;
        border-radius: 14px;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #06111e;
        box-shadow: 0 15px 30px rgba(125, 211, 252, 0.28);
      }

      .ghost-btn {
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.02);
        color: var(--text);
      }

      .primary-btn:hover,
      .ghost-btn:hover,
      .social-link:hover,
      .brand-card:hover {
        transform: translateY(-2px);
      }

      section {
        margin-top: 42px;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }

      .section-head h2 {
        font-size: clamp(1.4rem, 2vw, 2rem);
        letter-spacing: -0.04em;
      }

      .section-badge {
        color: var(--accent-3);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .brand-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }

      .brand-card {
        background: linear-gradient(180deg, rgba(19, 32, 50, 0.78), rgba(14, 26, 39, 0.9));
        border: 1px solid var(--card-border);
        border-radius: 22px;
        padding: 24px 22px 20px;
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.14);
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .brand-card:hover {
        border-color: rgba(125, 211, 252, 0.38);
      }

      .brand-card .tag {
        display: inline-block;
        margin-bottom: 14px;
        color: var(--accent-3);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-weight: 700;
      }

      .brand-card h3 {
        font-size: 1.18rem;
        margin-bottom: 10px;
        line-height: 1.3;
      }

      .brand-card p {
        color: var(--muted);
        line-height: 1.7;
        font-size: 0.95rem;
        margin-bottom: 18px;
      }

      .brand-card a {
        color: var(--text);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .social-list {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        list-style: none;
      }

      .social-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 18px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--card-border);
        color: var(--soft);
        font-weight: 600;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .social-link:hover {
        border-color: rgba(125, 211, 252, 0.38);
        box-shadow: 0 0 0 1px rgba(125, 211, 252, 0.1);
      }

      footer {
        padding-top: 40px;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
        letter-spacing: 0.03em;
      }

      @media (max-width: 640px) {
        .hero {
          padding: 30px 20px 26px;
        }

        .section-head {
          align-items: flex-start;
          flex-direction: column;
        }

        .actions {
          flex-direction: column;
          align-items: stretch;
        }

        .primary-btn,
        .ghost-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div class="pill">Creator Ecosystem</div>
      </div>

      <header class="hero">
        <div class="hero-inner">
          <div class="eyebrow">Official Portfolio</div>
          <h1 id="brandName">Loading...</h1>
          <p class="subtitle" id="brandSubtitle"></p>
          <p class="founder" id="brandFounder"></p>

          <div class="actions">
            <a id="hubLink" class="primary-btn" href="#" target="_blank" rel="noopener noreferrer">
              Visit Linktree Hub
            </a>
            <a class="ghost-btn" href="#brands">Explore Brands</a>
          </div>
        </div>
      </header>

      <section id="brands">
        <div class="section-head">
          <h2>Digital Creation Sub-Brands</h2>
          <span class="section-badge">Ecosystem</span>
        </div>
        <div id="brandGrid" class="brand-grid"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>Connect & Contact</h2>
          <span class="section-badge">Reach Me</span>
        </div>
        <ul id="socialList" class="social-list"></ul>
      </section>

      <footer>
        <p>&copy; 2026 <span id="footerBrand"></span> — Built for digital storytelling and creative growth.</p>
      </footer>
    </div>

    <script>
      async function loadBrand() {
        try {
          const response = await fetch("./data.json");
          if (!response.ok) throw new Error("Failed to load data");
          const data = await response.json();

          document.getElementById("brandName").textContent = data.brandName;
          document.getElementById("brandSubtitle").textContent = data.subtitle;
          document.getElementById("brandFounder").textContent = `Founder: ${data.founder}`;
          document.getElementById("hubLink").href = data.hubLink;
          document.getElementById("footerBrand").textContent = data.brandName;

          const brandGrid = document.getElementById("brandGrid");
          brandGrid.innerHTML = data.subBrands
            .map(
              (brand) => `
                <article class="brand-card">
                  <span class="tag">Brand</span>
                  <h3>${brand.name}</h3>
                  <p>${brand.description}</p>
                  <a href="${brand.link}" target="_blank" rel="noopener noreferrer">Explore brand →</a>
                </article>
              `
            )
            .join("");

          const socialList = document.getElementById("socialList");
          socialList.innerHTML = data.socialLinks
            .map(
              (item) => `
                <li>
                  <a class="social-link" href="${item.url}" target="_blank" rel="noopener noreferrer">
                    ${item.label}
                  </a>
                </li>
              `
            )
            .join("");
        } catch (error) {
          console.error("Brand data error:", error);
          document.getElementById("brandName").textContent = "Brand data unavailable";
        }
      }

      loadBrand();
    </script>
  </body>
</html>
